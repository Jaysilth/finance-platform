spring:
  application:
    name: finance-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_platform}
    username: ${DB_USERNAME:finance_user}
    password: ${DB_PASSWORD:finance_pass}

  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # DEV-ONLY DEFAULT — override with a real secret via env var in every
    # non-local environment. Must be >= 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploy-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days — personal-use app, no refresh-token flow yet

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.financeplatform: INFO
